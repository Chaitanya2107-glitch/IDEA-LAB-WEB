
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICTE IDEA Lab</title>
    <link rel="icon" type="image/png" href="https://files.reva.ac.in/assets/frontend/images/logo-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'sans-serif'],
            },
            colors: {
              // Shifted one step darker so brand-600 passes WCAG AA:
              // text on white 5.18:1, on slate-50 4.95:1, white-on-600 5.18:1.
              // brand-500 (#ea580c, the old brand) = icons, dots, focus rings only.
              brand: {
                50: '#fff7ed',
                100: '#ffedd5',
                200: '#fed7aa',
                300: '#fdba74',
                400: '#fb923c',
                500: '#ea580c',
                600: '#c2410c',
                700: '#9a3412',
                800: '#7c2d12',
                900: '#5c220d',
                950: '#431407',
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out both',
              'slide-up': 'slideUp 0.4s ease-out both',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          },
        },
      }
    </script>
    <style>
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* alias used by carousel */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Default keyboard focus ring for every button/link (brand-500, 3.56:1 non-text) */
      :focus-visible { outline: 2px solid #ea580c; outline-offset: 2px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",

    "three": "https://esm.sh/three@0.160.0",
    "three-stdlib": "https://esm.sh/three-stdlib@2.29.0?external=three",
    "jspdf-autotable": "https://aistudiocdn.com/jspdf-autotable@^5.0.2",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4",
    "@vercel/analytics/react": "https://esm.sh/@vercel/analytics@1.4.1/react?external=react,react-dom",
    "@vercel/analytics/": "https://aistudiocdn.com/@vercel/analytics@^1.6.1/",
    "pg": "https://esm.sh/pg@^8.16.3",
    "google-auth-library": "https://esm.sh/google-auth-library@^10.5.0",
    "formidable": "https://esm.sh/formidable@^3.5.4",
    "fs": "https://esm.sh/fs@^0.0.1-security",
    "@vercel/node": "https://esm.sh/@vercel/node@^5.5.15",
    "jsonwebtoken": "https://esm.sh/jsonwebtoken@^9.0.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-white font-sans text-slate-700 antialiased selection:bg-brand-100 selection:text-brand-900 overflow-x-hidden w-full">

</html>
