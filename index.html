
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICTE IDEA Lab</title>
    <link rel="icon" type="image/png" href="https://files.reva.ac.in/assets/frontend/images/logo-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    
    
    <style>
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* alias used by carousel */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Default keyboard focus ring for every button/link (brand-500, 3.56:1 non-text) */
      :focus-visible { outline: 2px solid #ea580c; outline-offset: 2px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
    </style>
</head>
  <body class="bg-white font-sans text-slate-700 antialiased selection:bg-brand-100 selection:text-brand-900 overflow-x-hidden w-full">
    <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
